version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./recruitment.db
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=prod-secret-replace-me
      - CALENDAR_TIMEZONE=UTC
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
